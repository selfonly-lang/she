<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHE｜精選產品與服務</title><style>body{margin:0;background:#f8f5ef;color:#2c241f;font:19px/1.75 system-ui,"Noto Sans TC"}*{box-sizing:border-box}header{background:#2b241f;color:white;padding:24px 5vw}header a{color:inherit}main{max-width:1250px;margin:auto;padding:40px 24px}h1{font:500 clamp(38px,6vw,70px) Georgia,serif}h2{font-size:28px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.card{background:#fff;border:1px solid #dacec1;border-radius:16px;overflow:hidden}.visual{height:245px;background:linear-gradient(130deg,#dfd3c4,#eee9df);display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;font:italic 40px Georgia;color:#6b5643}.card:nth-child(2n) .visual{background:linear-gradient(130deg,#e5e8e7,#c8d1d3);color:#2a5058}.copy{padding:25px}.chip{border:1px solid #a58b6e;border-radius:99px;padding:6px 15px;color:#6c553c;display:inline-block;font-size:16px}button{font:inherit;min-height:53px;padding:10px 20px;border:0;background:#493629;color:white;border-radius:10px}a{color:#62482b}.price{font-size:24px;font-weight:700}.muted{color:#6c5d53}p{line-height:1.75}@media(max-width:760px){.cards{grid-template-columns:1fr}.visual{height:260px}}</style><header><a href="/">SHE 首頁</a>　／　<a href="/admin/">會員後台</a>　／　精選產品與服務</header><main><h1>SHE SELECTED</h1><p>精選美容、健康科技及專業設備產品系列。各系列的型號、適用範圍及報價以品牌與管理員核定資料為準；涉及醫療設備者須由合格專業人員提供說明。</p><div id="status" class="muted">正在讀取上架項目…</div><div class="cards" id="cards"></div></main><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2.75.1";const db=createClient("https://tlpsqaywjcgowprhauod.supabase.co","sb_publishable_sQQtebH-fuHcAMm4e4wCPg_xRmac_l-");const {data:products,error}=await db.from("she_products").select("id,title,brand,summary,description,spec,source_url,verification_status,category,image_url,display_order").order("display_order");const cards=document.getElementById("cards"),status=document.getElementById("status");status.textContent=error?"資料讀取未完成："+error.message:products.length?"目前已上架 "+products.length+" 個系列":"尚無公開系列";if(!error){const res=await db.from("she_prices").select("product_id,price_key,amount");const priceData=res.data||[];for(const p of products){const art=document.createElement("article");art.className="card";const visual=document.createElement("div");visual.className="visual";if(p.image_url&&/^https:\/\//.test(p.image_url)){const img=new Image();img.src=p.image_url;img.alt=p.title;img.style.cssText="width:100%;height:100%;object-fit:contain;padding:20px";visual.append(img)}else visual.textContent=p.brand||p.title;const body=document.createElement("div");body.className="copy";const cat=document.createElement("span");cat.className="chip";cat.textContent=p.category;const h=document.createElement("h2");h.textContent=p.title;const desc=document.createElement("p");desc.textContent=p.summary;const pr=document.createElement("p");pr.className="price";const prices=priceData.filter(x=>x.product_id===p.id);pr.textContent=prices.length?prices.map(x=>({list:"定價",selling:"一般會員價",paid:"付費會員價",dealer:"商務 VIP 價",agency:"經理價"}[x.price_key]||"價格")+": NT$"+Number(x.amount).toLocaleString()).join("　"):"價格請洽客服／登入查看資格價格";const details=document.createElement("p");details.textContent=p.verification_status==="verified"?(p.spec||p.description||""):"產品詳細型號、照片、規格與售價待品牌資料核對";const source=document.createElement("p");if(p.source_url&&p.source_url.startsWith("https://")){const a=document.createElement("a");a.href=p.source_url;a.textContent="查看原廠產品資料 ↗";a.target="_blank";a.rel="noopener noreferrer";a.style.cssText="display:inline-block;background:#352a23;color:white;padding:12px 18px;border-radius:10px;font-weight:700;text-decoration:none";source.append(a)}body.append(cat,h,desc,details,pr,source);art.append(visual,body);cards.append(art)}};</script></html>
