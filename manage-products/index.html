<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHE｜商品與等級批次管理</title><style>body{margin:0;background:#f6f2ee;color:#332a24;font:18px/1.65 system-ui,"Noto Sans TC"}header{background:#2a231e;color:#fff;padding:22px 5vw}header a{color:white}main{max-width:1380px;margin:auto;padding:28px 22px}h1{font-size:32px}h2{font-size:25px}section{padding:25px;background:white;border:1px solid #ddcfc2;border-radius:16px;margin:25px 0}button,input,select{font:inherit;min-height:51px;border-radius:9px}button{border:0;background:#443328;color:white;padding:9px 17px;cursor:pointer}button:disabled{opacity:.45}select,input{border:1px solid #ae9e8d;padding:9px 12px;background:white}input[type=checkbox]{min-width:24px;width:24px;min-height:24px;height:24px}.layout{display:flex;flex-wrap:wrap;align-items:center;gap:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}table{border-collapse:collapse;min-width:900px;width:100%}td,th{border-bottom:1px solid #ddd;padding:16px 12px;text-align:left}th{background:#f1e7db}.scroll{overflow:auto}.muted{color:#64564c}#status{padding:13px;background:#eadfce;border-radius:9px}select{max-width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:16px}section{padding:17px}}</style><header><a href="/admin/">← SHE 營運後台</a>　｜　<a href="/catalog/">商品公開頁</a></header><main><h1>商品與會員等級・批次管理</h1><p id="status">正在驗證管理權限…</p><div id="panel" hidden><section><h2>批次操作</h2><p>請勾選下方系列，再選擇要開放的會員群組。管理員可調整商品是否上架，以及每個級別是否可查看商品與相應價格。</p><div class="layout"><label>會員群組<select id="tier"><option value="visitor">訪客</option><option value="member">一般會員</option><option value="paid">付費會員</option><option value="business">商務 VIP</option><option value="manager">經理版主</option></select></label><label>操作<select id="action"><option value="visible-on">顯示商品</option><option value="visible-off">隱藏商品</option><option value="price-on">開放此級別價格</option><option value="price-off">隱藏此級別價格</option><option value="publish-on">商品上架</option><option value="publish-off">商品下架</option><option value="master-price-on">價格總開關 ON</option><option value="master-price-off">價格總開關 OFF</option></select></label><button id="apply">套用至勾選系列</button></div></section><section><h2>商品清單</h2><div class="scroll"><table><thead><tr><th><input id="all" type="checkbox" aria-label="全選商品"></th><th>系列</th><th>上架</th><th>價格總開關</th><th>訪客</th><th>一般</th><th>付費</th><th>商務 VIP</th><th>經理</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2>產品圖文、規格與來源編輯</h2><p>商品圖片請上傳已取得品牌授權的真實照片。正式規格及來源核對前，對外維持「待核實」。</p><div class="grid"><label>選擇產品<select id="edit-product"></select></label><label>顯示名稱<input id="edit-title" maxlength="140"></label><label>品牌<input id="edit-brand" maxlength="120"></label><label>商品類型<select id="edit-type"><option value="product">產品</option><option value="service">服務</option></select></label><label>分類<input id="edit-category" maxlength="90"></label><label>規格／型號<input id="edit-spec" maxlength="300"></label><label>資料來源網址<input id="edit-source" type="url" placeholder="https://"></label><label>商品照片上傳<input id="edit-image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>審核狀態<select id="edit-verification"><option value="pending">待核實</option><option value="verified">已核實</option></select></label></div><label>詳細介紹<textarea id="edit-description" style="width:100%;min-height:150px;font:inherit"></textarea></label><div class="layout"><button id="save-product">儲存商品資料</button><img id="image-preview" alt="商品圖片預覽" style="max-width:210px;max-height:175px;object-fit:contain"></div></section><section><h2>單品價格設定（由管理員填入正式價格）</h2><div class="grid"><label>產品<select id="product"></select></label><label>價目等級<select id="pricekey"><option value="list">定價／訪客</option><option value="selling">一般會員</option><option value="paid">付費會員</option><option value="dealer">商務 VIP</option><option value="agency">經理</option><option value="floor">財務底價</option></select></label><label>含稅售價 NT$ <input type="number" id="amount" min="0" step=".01" placeholder="尚未填入"></label><div><button id="save-price">儲存價格</button></div></div><p class="muted">儲存價格不代表公開：必須同時啟用商品、價格總開關及該等級價格開關。底價僅由財務或最高管理員維護。</p></section></div></main><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2.75.1";const db=createClient("https://tlpsqaywjcgowprhauod.supabase.co","sb_publishable_sQQtebH-fuHcAMm4e4wCPg_xRmac_l-"),E=id=>document.getElementById(id);let all=[],v=[],role=null;function set(s){E("status").textContent=s}function assert(r){if(r.error)throw r.error;return r.data||[]}async function load(){const au=await db.auth.getUser();if(!au.data.user)return set("請先到 SHE 後台登入，再進入商品管理。");const rr=await db.from("she_staff_roles").select("role").eq("user_id",au.data.user.id).maybeSingle();role=rr.data?.role;if(!["super_admin","product","finance"].includes(role))return set("您尚未獲授權管理商品及價目。");E("panel").hidden=false;all=assert(await db.from("she_products").select("id,title,brand,category,summary,description,spec,image_url,source_url,verification_status,item_type,active,price_visible").order("display_order"));v=assert(await db.from("she_product_visibility").select("product_id,audience,enabled,show_price"));const tb=E("rows");tb.replaceChildren();E("product").replaceChildren();E("edit-product").replaceChildren();for(const p of all){const opt=new Option(p.title,p.id);E("product").append(opt);E("edit-product").append(new Option(p.title,p.id));const tr=document.createElement("tr");const td=document.createElement("td");const ch=document.createElement("input");ch.type="checkbox";ch.value=p.id;ch.className="pick";td.append(ch);tr.append(td);for(const val of [p.title,p.active?"已上架":"下架",p.price_visible?"開":"關",...["visitor","member","paid","business","manager"].map(a=>{const x=v.find(x=>x.product_id===p.id&&x.audience===a);return (x?.enabled?"顯示":"隱藏")+"/"+(x?.show_price?"價開":"價關")})]){const cell=document.createElement("td");cell.textContent=val;tr.append(cell)}tb.append(tr)}fillEditor();set("已載入 "+all.length+" 項商品。")}E("all").onchange=e=>document.querySelectorAll(".pick").forEach(c=>c.checked=e.target.checked);function fillEditor(){const p=all.find(x=>x.id===E("edit-product").value)||all[0];if(!p)return;for(const [id,k] of [["edit-title","title"],["edit-brand","brand"],["edit-category","category"],["edit-spec","spec"],["edit-source","source_url"],["edit-description","description"],["edit-type","item_type"],["edit-verification","verification_status"]])E(id).value=p[k]||"";E("image-preview").src=p.image_url||"";}E("edit-product").onchange=fillEditor;E("save-product").onclick=async()=>{const id=E("edit-product").value;let data={title:E("edit-title").value.trim(),brand:E("edit-brand").value.trim(),category:E("edit-category").value.trim(),spec:E("edit-spec").value.trim(),source_url:E("edit-source").value.trim()||null,description:E("edit-description").value.trim(),item_type:E("edit-type").value,verification_status:E("edit-verification").value};if(!data.title)return set("請輸入商品名稱");if(data.source_url&&!data.source_url.startsWith("https://"))return set("來源網址請使用 HTTPS");if(data.verification_status==="verified"&&!data.source_url)return set("標記已核實前請填入可信來源網址");const file=E("edit-image").files[0];try{if(file){if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>10485760)throw Error("圖片僅接受 JPG/PNG/WEBP，大小不得超過 10MB");const au=await db.auth.getUser(),ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";const path=au.data.user.id+"/she-product-"+crypto.randomUUID()+"."+ext;const up=await db.storage.from("she-public").upload(path,file,{contentType:file.type});if(up.error)throw up.error;data.image_url=db.storage.from("she-public").getPublicUrl(path).data.publicUrl;}assert(await db.from("she_products").update(data).eq("id",id));await load();set("商品圖文規格已儲存")}catch(e){set("儲存失敗："+e.message)}};E("apply").onclick=async()=>{const ids=[...document.querySelectorAll(".pick:checked")].map(x=>x.value),act=E("action").value,tier=E("tier").value;if(!ids.length)return set("請先選擇商品");if(role==="finance")return set("財務可維護價格，但商品上架及級別開關由商品管理員操作");if(!confirm("確定對 "+ids.length+" 個商品套用「"+E("action").selectedOptions[0].textContent+"」？"))return;try{const out=await db.rpc("she_batch_product_settings",{p_product_ids:ids,p_audience:tier,p_action:act});if(out.error)throw out.errorawait load();set("批次操作已儲存")}catch(err){set("更新失敗："+err.message)}};E("save-price").onclick=async()=>{if(!E("amount").value)return set("請輸入核實售價");if(E("pricekey").value==="floor"&&!["super_admin","finance"].includes(role))return set("底價僅限財務人員");try{assert(await db.from("she_prices").upsert({product_id:E("product").value,price_key:E("pricekey").value,amount:Number(E("amount").value)},{onConflict:"product_id,price_key"}));set("價格已儲存（顯示開關不受影響）")}catch(err){set("儲存失敗："+err.message)}};load().catch(e=>set("資料讀取失敗："+e.message));</script></html>
