<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17120f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Self AI"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Self AI・己美數位分身</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed portrait hero; a glowing orb dial (hold to talk, tap to open) sits over the lower third; the conversation panel rises slowly from the orb. */
:root{
  --bg:#f3ece6; --bg2:#e9dcd3; --paper:rgba(255,250,246,.74); --paper-solid:#fffaf7;
  --fg:#2b2024; --muted:#8a747b; --line:rgba(120,80,90,.16);
  --gold:#c9a27c; --gold2:#eedccb; --rose:#d08aa3; --plum:#5a2e45; --ok:#4f8a6b;
  --ink:#fff; --ink-soft:rgba(255,255,255,.78);
  --shadow:0 18px 40px rgba(90,46,69,.16);
  --display:"Cormorant Garamond","Noto Serif TC",serif; --cjk:"Noto Serif TC",serif; --body:"Noto Sans TC",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.26,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1a1316; --bg2:#231a1e; --paper:rgba(40,30,35,.74); --paper-solid:#2a1f24; --fg:#f5ecef; --muted:#b39aa4; --line:rgba(255,220,230,.14); --gold:#d9b490; --gold2:#4a3630; --rose:#e39ab2; --plum:#f0d7e2; --ok:#8fcfae; --shadow:0 18px 40px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1a1316; --bg2:#231a1e; --paper:rgba(40,30,35,.74); --paper-solid:#2a1f24; --fg:#f5ecef; --muted:#b39aa4; --line:rgba(255,220,230,.14); --gold:#d9b490; --gold2:#4a3630; --rose:#e39ab2; --plum:#f0d7e2; --ok:#8fcfae; --shadow:0 18px 40px rgba(0,0,0,.5); color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;display:flex;justify-content:center}
#root{width:100%;max-width:480px;min-height:100%;position:relative}

/* ---------- hero home ---------- */
.hero{position:relative;min-height:100svh;overflow:hidden;background:#17120f;display:flex;flex-direction:column}
.stageWrap{position:absolute;inset:0;overflow:hidden}
.track{position:absolute;inset:0;z-index:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.8s var(--ease);pointer-events:none}
.slide.on{opacity:1}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transform:scale(1.03);transition:opacity 1.4s var(--ease)}
.slide .talk{opacity:0}.slide.talking .talk{opacity:1}
.stageWrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 50%,rgba(30,20,22,.55) 74%,rgba(30,20,22,.92) 100%);pointer-events:none}
.dots{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px) + 48px);transform:translateX(-50%);z-index:3;display:flex;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .6s var(--ease)}.dots i.on{width:18px;border-radius:999px;background:var(--gold)}
.avname{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);z-index:3;color:var(--ink);font-family:var(--cjk);font-size:13px;letter-spacing:.3em;text-shadow:0 1px 8px rgba(0,0,0,.5);white-space:nowrap;animation:fadeUp 1s var(--ease) both}
.hero .top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.logo{color:var(--ink);text-shadow:0 2px 10px rgba(0,0,0,.35);animation:fadeUp 1.2s var(--ease) both}
.logo .mark{font-family:var(--display);font-size:24px;letter-spacing:.14em;font-weight:600;line-height:1}
.logo .mark b{font-family:var(--cjk);font-size:19px;letter-spacing:.1em;margin-left:6px}
.logo small{display:block;font-size:8px;letter-spacing:.26em;opacity:.85;margin-top:4px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;color:var(--gold);font-size:16px;cursor:pointer;appearance:none;font:inherit;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeUp 1.2s var(--ease) .2s both;transition:box-shadow .6s}
.iconbtn.on{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(201,162,124,.6)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.copy{position:relative;z-index:3;color:var(--ink);padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));text-shadow:0 2px 12px rgba(0,0,0,.4);max-width:50%}
.copy .q{font-family:var(--cjk);font-size:16px;line-height:1.6;letter-spacing:.08em;margin:0}
.copy .q span{display:block;animation:fadeUp 1.1s var(--ease) both}.copy .q span:nth-child(2){animation-delay:.25s}.copy .q span:nth-child(3){animation-delay:.5s}
.copy .q i{font-family:var(--display);font-style:italic;font-size:18px}
.copy .s{font-size:10.5px;letter-spacing:.16em;opacity:.85;margin:6px 0 0;animation:fadeUp 1.1s var(--ease) .8s both}
.copy,.logo,.iconbtn{transition:opacity .8s var(--ease)}
.hero.menu .copy,.hero.menu .logo{opacity:.3}

.dialwrap{position:relative;z-index:4;margin-top:auto;display:flex;flex-direction:column;align-items:center;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));transition:transform .5s var(--ease)}
.dialwrap.drag{transition:none}
.dragtip{position:absolute;left:50%;top:-6px;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:10px;letter-spacing:.14em;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .5s}
.dialwrap.drag .dragtip{opacity:1}
.dial{position:relative;width:min(88vw,380px);aspect-ratio:1/1;max-width:100%;touch-action:pan-x;user-select:none;-webkit-user-select:none;pointer-events:none}
.dialwrap{pointer-events:none}
.dial .orbwrap,.dial .chatbtn,.dialwrap .tap{pointer-events:auto}
.arc{position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(255,235,220,0);transition:border-color 1s var(--ease),box-shadow 1s var(--ease)}
.hero.menu .arc{border-color:rgba(255,235,220,.3);box-shadow:inset 0 0 70px rgba(255,220,200,.14)}
.node{position:absolute;width:64px;left:50%;top:60%;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;text-align:center;color:var(--ink);text-shadow:0 1px 8px rgba(0,0,0,.45);text-decoration:none;transition:transform 1.5s var(--ease),opacity 1.1s var(--ease),left 1.5s var(--ease),top 1.5s var(--ease),filter .3s;transition-delay:var(--d,0s)}
.hero:not(.menu) .node{transition-delay:0s;transition-duration:.8s}
.hero.menu .node{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.node .ring{width:52px;height:52px;margin:0 auto;border-radius:50%;background:rgba(40,28,32,.42);border:1.5px solid rgba(255,230,210,.75);display:grid;place-items:center;font-size:20px;color:var(--gold);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:box-shadow .45s var(--ease),background .35s,transform .5s var(--ease)}
.node b{display:block;font-size:13px;margin-top:5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.node small{display:block;font-size:9.5px;opacity:.8;white-space:nowrap;letter-spacing:.02em}
.node.hot{filter:brightness(1.15)}.node.hot .ring{box-shadow:0 0 0 10px rgba(233,200,170,.22),0 0 36px rgba(255,214,180,.6);background:rgba(201,162,124,.6)}
.node:active .ring{transform:scale(.92)}

/* 流動透明水晶球：透過 backdrop 折射背景、內嵌環境反射影像、虹彩與光芒 */
.orbwrap{position:absolute;left:50%;top:60%;width:33%;aspect-ratio:1/1;transform:translate(-50%,-50%);perspective:700px}
.orb{position:relative;width:100%;height:100%;border-radius:50%;border:0;padding:0;cursor:pointer;display:grid;place-items:center;color:#fff;isolation:isolate;transform-style:preserve-3d;overflow:visible;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85) 0%,rgba(255,244,248,.55) 10%,rgba(240,220,235,.28) 28%,rgba(200,215,255,.22) 48%,rgba(170,150,220,.3) 70%,rgba(70,40,90,.55) 100%);
  backdrop-filter:blur(6px) saturate(1.5) brightness(1.08);-webkit-backdrop-filter:blur(6px) saturate(1.5) brightness(1.08);
  box-shadow:0 26px 56px rgba(40,20,40,.55),0 0 50px rgba(255,215,230,.45),0 0 120px rgba(255,205,180,.25),inset 0 -22px 40px rgba(80,40,110,.45),inset 0 14px 28px rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.55);
  transition:transform 1.2s var(--ease),box-shadow 1.3s var(--ease);animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-5px)}}
.orb .env{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:0;opacity:.55;mix-blend-mode:screen;-webkit-mask:radial-gradient(circle at 50% 45%,#000 55%,transparent 72%);mask:radial-gradient(circle at 50% 45%,#000 55%,transparent 72%)}
.orb .env video{width:100%;height:100%;object-fit:cover;object-position:top;transform:scaleX(-1) scale(1.6) translateY(6%);filter:blur(3px) saturate(1.6) contrast(1.1);animation:envdrift 9s ease-in-out infinite}
@keyframes envdrift{50%{transform:scaleX(-1) scale(1.7) translate(3%,2%)}}
.orb::before{content:"";position:absolute;inset:-7%;border-radius:50%;z-index:-1;
  background:conic-gradient(from 0deg,rgba(247,231,207,.9),rgba(201,162,124,.9) 12%,#fff6e8 25%,rgba(143,111,82,.9) 38%,#e8c9b3 50%,#fffaf0 62%,rgba(184,134,107,.9) 75%,rgba(247,231,207,.9) 88%,rgba(201,162,124,.9));
  -webkit-mask:radial-gradient(circle,transparent 86%,#000 87%);mask:radial-gradient(circle,transparent 86%,#000 87%);animation:spin 18s linear infinite;filter:drop-shadow(0 0 10px rgba(255,220,190,.5))}
@keyframes spin{to{transform:rotate(360deg)}}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 200deg,rgba(255,180,220,0),rgba(170,220,255,.55),rgba(255,230,180,.45),rgba(220,170,255,.5),rgba(160,255,230,.4),rgba(255,180,220,0));mix-blend-mode:screen;animation:spin 11s linear infinite reverse;opacity:.8;z-index:1}
.orb .water{position:absolute;inset:0;border-radius:50%;z-index:1;overflow:hidden;
  background:repeating-radial-gradient(circle at 40% 35%,rgba(255,255,255,0) 0 6%,rgba(255,255,255,.22) 7% 8%,rgba(255,255,255,0) 9% 14%);mix-blend-mode:overlay;animation:water 8s ease-in-out infinite}
@keyframes water{50%{transform:scale(1.1) rotate(8deg);opacity:.55}}
.orb .flow{position:absolute;inset:0;border-radius:50%;z-index:1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,rgba(255,255,255,.08) 52%,transparent 65%);animation:flow 6.5s ease-in-out infinite;mix-blend-mode:screen}
@keyframes flow{0%{transform:translateX(-60%) rotate(0deg)}50%{transform:translateX(60%) rotate(10deg)}100%{transform:translateX(-60%) rotate(0deg)}}
.orb .rays{position:absolute;inset:-36%;border-radius:50%;z-index:-2;
  background:conic-gradient(from 0deg,transparent 0 6%,rgba(255,236,210,.4) 7% 8%,transparent 9% 22%,rgba(255,220,240,.35) 23% 24%,transparent 25% 41%,rgba(220,235,255,.4) 42% 43%,transparent 44% 60%,rgba(255,236,210,.35) 61% 62%,transparent 63% 78%,rgba(255,220,240,.35) 79% 80%,transparent 81% 100%);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 44s linear infinite;filter:blur(1px)}
.orb .spec{position:absolute;left:22%;top:13%;width:34%;height:22%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.98),rgba(255,255,255,0) 70%);transform:rotate(-20deg);z-index:2}
.orb .spec2{position:absolute;right:16%;bottom:16%;width:24%;height:12%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.6),rgba(255,255,255,0) 70%);z-index:2}
.orb .glint{position:absolute;left:50%;top:50%;width:140%;height:3px;transform:translate(-50%,-50%) rotate(-30deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);z-index:2;opacity:0;animation:glint 6s ease-in-out infinite}
@keyframes glint{0%,70%,100%{opacity:0;transform:translate(-50%,-50%) rotate(-30deg) translateX(-60%)}80%{opacity:.9}90%{opacity:0;transform:translate(-50%,-50%) rotate(-30deg) translateX(60%)}}
.orb svg{width:36%;height:36%;position:relative;z-index:3;filter:drop-shadow(0 2px 8px rgba(120,60,90,.5))}
.orb .halo{position:absolute;inset:-28%;border-radius:50%;z-index:-3;background:radial-gradient(circle,rgba(255,220,200,.55),rgba(255,200,220,.2) 45%,transparent 66%);animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.14);opacity:.7}}
.orb.press{transform:scale(.92);box-shadow:0 10px 30px rgba(40,20,40,.5),0 0 36px rgba(255,215,230,.35),inset 0 -16px 32px rgba(80,40,110,.5),inset 0 10px 22px rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.5)}
.orb.hold{animation:none;transform:scale(1.08);box-shadow:0 28px 64px rgba(40,20,40,.6),0 0 90px rgba(255,180,200,.95),0 0 180px rgba(255,200,170,.75),inset 0 -22px 40px rgba(80,40,110,.45),inset 0 14px 28px rgba(255,255,255,.65),inset 0 0 0 1px rgba(255,255,255,.7)}
.orb.hold .halo{animation-duration:1.3s}.orb.hold .rays{animation-duration:7s}
.orb .rip{position:absolute;inset:-4%;border-radius:50%;border:2px solid rgba(255,255,255,.75);animation:ripple 1.7s ease-out infinite;z-index:-1}
@keyframes ripple{to{transform:scale(1.6);opacity:0}}
.hint{position:absolute;left:50%;top:85%;transform:translateX(-50%);color:var(--ink-soft);font-size:11px;letter-spacing:.14em;text-align:center;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.45);transition:opacity .6s}
.tap{position:relative;z-index:3;color:var(--ink);font-family:var(--cjk);font-size:14px;letter-spacing:.28em;text-align:center;margin:-4px 0 0;text-shadow:0 1px 8px rgba(0,0,0,.45);animation:fadeUp 1.1s var(--ease) 1.1s both}
.chatbtn{position:absolute;right:0;top:4%;appearance:none;border:1px solid rgba(255,240,225,.6);background:rgba(40,28,32,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);font:inherit;font-size:12px;letter-spacing:.1em;padding:8px 14px;border-radius:999px;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.chatbtn.show{opacity:1;transform:none}
.swipehint{position:absolute;left:0;right:0;top:46%;z-index:3;display:flex;justify-content:space-between;padding:0 10px;color:rgba(255,255,255,.55);font-size:26px;pointer-events:none;animation:fadeUp 1.2s var(--ease) 1.3s both}
.swipehint span{cursor:pointer;pointer-events:auto;padding:10px}

/* 音樂面板 */
.music{position:absolute;left:0;right:0;top:0;z-index:7;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(255,250,246,.96),rgba(255,250,246,.9));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:0 0 30px 30px;box-shadow:0 20px 60px rgba(90,46,69,.25);
  transform:translateY(-104%);opacity:0;transition:transform 1s var(--ease),opacity .8s var(--ease)}
:root[data-theme="dark"] .music{background:linear-gradient(180deg,rgba(40,30,35,.97),rgba(40,30,35,.92))}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .music{background:linear-gradient(180deg,rgba(40,30,35,.97),rgba(40,30,35,.92))} }
.music.open{transform:none;opacity:1}
.music h3{margin:0 0 4px;font-family:var(--cjk);font-size:17px}
.music .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
.chan{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.chan button{appearance:none;border:1px solid var(--line);background:var(--paper-solid);color:var(--fg);font:inherit;font-size:13px;border-radius:14px;padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.chan button i{font-style:normal;font-size:18px;color:var(--gold)}
.chan button.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,124,.2);font-weight:700}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow .btn{width:auto;min-height:42px;padding:8px 16px;font-size:14px}
.mrow label.file{border:1px solid var(--line);background:var(--paper-solid);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
.mrow input[type=file]{display:none}
.mrow a{color:var(--rose);font-size:14px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 14px}
.vol{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.vol input{flex:1;accent-color:var(--gold)}
.now{font-size:13px;color:var(--muted);margin-top:8px}
/* ---------- conversation panel ---------- */
.panel{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:58svh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(255,250,246,.86),rgba(255,250,246,.96));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:34px 34px 0 0;border-top:1px solid rgba(255,255,255,.8);box-shadow:0 -30px 80px rgba(90,46,69,.28);
  transform:translateY(104%);opacity:0;transition:transform 1.1s var(--ease),opacity .9s var(--ease);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
:root[data-theme="dark"] .panel{background:linear-gradient(180deg,rgba(40,30,35,.9),rgba(40,30,35,.97))}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .panel{background:linear-gradient(180deg,rgba(40,30,35,.9),rgba(40,30,35,.97))} }
.panel.open{transform:translateY(0);opacity:1}
.panel::before{content:"";position:absolute;left:50%;top:-70px;width:220px;height:140px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 100%,rgba(255,214,226,.9),rgba(255,200,170,.4) 50%,transparent 75%);filter:blur(10px);opacity:0;transition:opacity 1.4s var(--ease) .2s;pointer-events:none}
.panel.open::before{opacity:1}
.grab{width:44px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 10px}
.ticker{overflow:hidden;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 0;font-size:13px;color:var(--muted);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker span{display:inline-block;padding-left:100%;animation:marquee 26s linear infinite}
@keyframes marquee{to{transform:translateX(-100%)}}
.ticker i{font-style:normal;color:var(--gold);margin:0 14px 0 0}
.thread{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 2px;min-height:120px}
.msg{max-width:86%;padding:12px 16px;border-radius:20px;font-size:17px;line-height:1.55;opacity:0;transform:translateY(10px);animation:rise .8s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.msg.ai{align-self:flex-start;background:var(--paper-solid);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 6px 18px rgba(90,46,69,.08)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--rose),var(--plum));color:#fff;border-bottom-right-radius:6px}
.msg .who{display:block;font-size:11px;letter-spacing:.12em;color:var(--gold);margin-bottom:3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{appearance:none;flex:none;border:1px solid var(--line);background:var(--paper-solid);color:var(--fg);font:inherit;font-size:14px;border-radius:999px;padding:8px 14px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center}
.row input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper-solid);color:var(--fg)}
.row .btn{width:auto;min-height:46px;padding:8px 18px;font-size:15px}
.btn{appearance:none;border:0;border-radius:999px;background:linear-gradient(135deg,var(--rose),var(--plum));color:#fff;font:inherit;font-size:17px;font-weight:700;padding:14px 22px;width:100%;cursor:pointer;min-height:54px;box-shadow:0 10px 24px rgba(199,109,138,.35)}

  function toggleMusic(){ if(musOn){ musicStop(); setMusOn(false); } else { const c=CHANNELS.find(x=>x.k===chan)||CHANNELS[0]; setChan(c.k); setMusOn(true); musicStart(c); } }

  const R=47;
  return h`<div class=${"hero"+(menu?" menu":"")} onPointerMove=${tilt} onPointerLeave=${untilt} onPointerDown=${sDown} onPointerUp=${sUp}>
    <div class="stageWrap"><div class="track">
      ${AVATARS.map((a,i)=>h`<div class=${"slide"+(i===av?" on":"")+(i===av&&state==="talk"?" talking":"")} key=${a.k}>
        ${a.k==="mine"?(a.photo?h`<img class="photo" src=${a.photo} alt=""/>${a.talk?h`<video class="talk" ref=${el=>vids.current[i*2+1]=el} src=${a.talk} muted playsinline loop autoplay></video>`:null}`:h`<div class="empty"><div class="sil">✦</div><b>建立我的分身</b><div class="note">拍一張正面照，她就會用你的樣子、你的聲音陪你。</div><button class="btn" onClick=${()=>{SFX.open();go("create");}}>開始建立</button></div>`)
        :h`<video ref=${el=>vids.current[i*2]=el} src=${a.idle} muted playsinline loop autoplay></video><video class="talk" ref=${el=>vids.current[i*2+1]=el} src=${a.talk} muted playsinline loop autoplay></video>`}</div>`)}
    </div></div>
    ${A.k==="mine"&&profile.greetVideo?h`<video class=${"greet"+(greeting?" on":"")} ref=${greetRef} src=${profile.greetVideo} playsinline preload="auto"></video>`:null}
    ${showGreet&&!greeting?h`<button class="greetbtn" onClick=${playGreet}>▶ ${profile.avatarName||"她"}想跟你說第一句話</button>`:null}
    <div class=${"cap"+((state==="talk"||state==="think")&&msgs.length?" show":"")}><small>${A.who}</small>${state==="think"?"…":(msgs.length&&msgs[msgs.length-1].r==="ai"?msgs[msgs.length-1].t:"")}</div>
    <div class=${"statusring "+state}><i></i>${{idle:"在線・陪伴中",listen:"聽你說",talk:"說話中",think:"思考中"}[state]}</div>
    ${A.k==="mine"&&A.photo?h`<div class="avtag">${profile.greetVideo?`${A.variant}・我的分身`:profile.greetRender?"開口影片生成中・約 5–10 分鐘":"開口影片等待排程"}</div>`:null}
    <div class="top"><div class="logo"><div class="mark">SELF<b>己美</b></div><small>BEAUTY, HEALTH, A BETTER YOU</small></div>
      <button class=${"iconbtn"+(musOn?" on":"")} onClick=${()=>{setMus(m=>!m);SFX.tick();}} aria-label="音樂">${musOn?"♫":"♪"}</button></div>
    <div class="dots">${AVATARS.map((a,i)=>h`<i class=${i===av?"on":""} onClick=${()=>switchAv(i)}></i>`)}</div>
    <div class="avname" key=${av}>${A.name}</div>
    ${A.k==="twin"?h`<div class="copy"><p class="q"><span>“Hi,</span><span>我是你的</span><span><i>SELF AI</i> 閨蜜”</span></p><p class="s">傾聽・理解・陪伴</p></div>`:h`<div class="copy"><p class="q"><span>${profile.name?profile.name+"，":""}</span><span>${A.k==="mine"?"理想中的你":A.name}</span></p><p class="s">${A.k==="mine"?"每天陪你，一起變成她":"己美 Self AI"}</p></div>`}
    <div class="swipehint"><span onClick=${()=>switchAv(av-1)} style=${{opacity:av>0?1:.15}}>‹</span><span onClick=${()=>switchAv(av+1)} style=${{opacity:av<AVATARS.length-1?1:.15}}>›</span></div>

    <div class=${"dialwrap"+(drag?" drag":"")} style=${{transform:`translate(${pos.x}px,${pos.y}px)`}}>
      <div class="dial"><div class="dragtip">拖曳到喜歡的位置</div>
        <div class="arc"></div>
        <button class=${"chatbtn"+(msgs.length>1||menu?" show":"")} onClick=${()=>{setOpen(o=>!o);(open?SFX.close:SFX.open)();buzz(10);}}>${open?"收起對話":"✎ 對話"}</button>
        ${NODES.map((n,idx)=>{ const rad=(n.a-180)*Math.PI/180; const x=50+R*Math.sin(rad), y=60-R*Math.cos(rad);
          return h`<a class=${"node"+(hot===n.k?" hot":"")} data-k=${n.k} href=${n.href||"#"} target=${n.href?"_blank":null} rel="noopener" style=${menu?{left:x+"%",top:y+"%","--d":(idx*0.09)+"s"}:{"--d":"0s"}} onClick=${e=>{ if(!n.href){e.preventDefault();} SFX.send(); buzz(20); if(!n.href) go(n.go); }}><div class="ring">${n.i}</div><b>${n.b}</b><small>${n.s}</small></a>`; })}
        <div class="orbwrap" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${cancel}>
          <button class=${"orb"+(hold?" hold":"")+(press?" press":"")} ref=${orbRef} aria-label="按住說話，點一下展開功能"><span class="halo"></span><span class="rays"></span>${hold?h`<span class="rip"></span>`:null}<span class="env">${A.idle?h`<video src=${A.idle} muted playsinline loop autoplay key=${A.k}></video>`:(A.photo?h`<img src=${A.photo} style=${{width:"100%",height:"100%",objectFit:"cover",transform:"scaleX(-1) scale(1.6)",filter:"blur(3px) saturate(1.5)"}}/>`:null)}</span><span class="water"></span><span class="flow"></span><span class="spec"></span><span class="spec2"></span><span class="glint"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
        </div>
        <div class="hint" style=${{opacity:hold||menu?1:0}}>${hold?(menu?"放開送出・滑到功能直接執行":"放開送出"):"點功能進入・再點水晶球收合"}</div>
      </div>
      <p class="tap">${drag?"放開即固定":menu?"點一下水晶球收合":hold?"我在聽…":"按住說話・點一下看功能・拖曳可移動"}</p>
    </div>

    <section class=${"music"+(mus?" open":"")}>
      <h3>Self AI 音樂</h3><p class="sub">內建頻道為 Self AI 即時生成的環境樂（無版權）；也可播放你自己的歌，或開啟 Apple Music。</p>
      <div class="chan">${CHANNELS.map(c=>h`<button class=${chan===c.k&&musOn?"on":""} onClick=${()=>pickChan(c)}><i>${c.i}</i>${c.n}</button>`)}</div>
      <div class="mrow"><button class="btn" onClick=${toggleMusic}>${musOn?"暫停":"播放"}</button>
        <label class="file">自己的歌<input type="file" id="song" accept="audio/*" onChange=${e=>{const f=e.target.files[0]; if(f){ musicFile(f); setMusOn(true); setChan("file"); }}}/></label>
        <a href="https://music.apple.com/tw/search?term=self%20care%20piano" target="_blank" rel="noopener">Apple Music ↗</a></div>
      <div class="vol">♪<input type="range" id="vol" min="0" max="1" step="0.02" value=${vol} onInput=${e=>{const v=+e.target.value; setVol(v); musicVolume(v);}}/></div>
      <div class="now">${musOn?("正在播放："+(music.ch&&music.ch.n||"")):"未播放"}</div>
      <div class="grab" style=${{marginTop:12}} onClick=${()=>setMus(false)}></div>
    </section>

    <section class=${"panel"+(open?" open":"")} aria-hidden=${!open}>
      <div class="grab" onClick=${()=>{setOpen(false);SFX.close();}}></div>
      <div class="ticker"><span>${TICKER.map(t=>h`<i>✦</i>${t}　　`)}</span></div>
      <div class="checkin"><span>${mood?("今天："+mood):"今天心情？"}</span><div class="faces">${MOODS.map(([f,m])=>h`<button class=${mood===m?"on":""} onClick=${()=>checkin(m)} title=${m}>${f}</button>`)}</div></div>
      <div class="today">${[...(profile.goals||[]).map(g=>({t:"✦ "+g})),{t:"早晚保養"},{t:"喝水 1,800ml"},{t:"拍今日對比照"}].slice(0,5).map((x,i)=>h`<div key=${i}>${x.t}</div>`)}</div>
      <div class="live ${state==="talk"?"on":state==="listen"?"listen":""}"><i></i>${{idle:"她在聽你說",listen:"我在聽…放開就送出",talk:"她正在說",think:"她想了一下…"}[state]}</div>
      <div class="thread">${msgs.map((m,i)=>h`<div class=${"msg "+m.r} key=${i}>${m.r==="ai"?h`<span class="who">${A.who}</span>`:null}${m.t}</div>`)}</div>
      <div class="chips">${["眼周細紋","膚質暗沉","幫我預約診所","提醒我保養","記錄今天"].map(c=>h`<button class="chip" onClick=${()=>ask(c)}>${c}</button>`)}</div>
      <div class="row"><input id="ask" value=${txt} onInput=${e=>setTxt(e.target.value)} onKeyDown=${e=>{if(e.key==="Enter"){ask(txt);setTxt("");}}} placeholder="或者打字…"/><button class="btn" onClick=${()=>{ask(txt);setTxt("");}}>送出</button></div>
    </section>
  </div>`;
}


function Create({go,profile,setProfile}){
  const [step,setStep]=useState(profile.consent?1:0); const [photo,setPhoto]=useState(profile.photo||null); const [variant,setVariant]=useState(profile.variant||"原圖");
  const [voice,setVoice]=useState(profile.voice||"warm"); const [name,setName]=useState(profile.avatarName||""); const [me,setMe]=useState(profile.name||""); const [age,setAge]=useState(profile.age||""); const [senior,setSenior]=useState(!!profile.senior); const [goal,setGoal]=useState((profile.goals||[])[0]||"");
  const [busy,setBusy]=useState(false);
  useEffect(()=>{ const lines=["這份同意書會用聲音唸給你聽。我們會用你的照片做出你的分身，只給你自己使用，隨時可以刪除。","把臉放進框裡，光線亮一點，正面看鏡頭。","選一個你最喜歡的樣子。","選一個聲音，按一下可以試聽。","幫她取個名字，也告訴我你的稱呼。","完成了，她想跟你說第一句話。"]; speak(lines[step]); },[step]);
  function onFile(e){ const f=e.target.files[0]; if(!f) return; const img=new Image(); const url=URL.createObjectURL(f); img.onload=()=>{ const c=document.createElement("canvas"); const s=Math.min(1,640/Math.max(img.width,img.height)); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); setPhoto(c.toDataURL("image/jpeg",.82)); URL.revokeObjectURL(url); SFX.reply(); buzz(15); }; img.src=url; }
  const VARS=[["原圖","none"],["柔膚透亮","brightness(1.06) saturate(1.08) contrast(.97)"],["氣色紅潤","brightness(1.04) saturate(1.2) sepia(.08)"]];
  const [busyMsg,setBusyMsg]=useState("");
  async function finish(){ setBusy(true); setBusyMsg("上傳照片中…");
    const p={...profile,consent:true,photo,variant,voice,avatarName:name||"我的分身",name:me,age:age?+age:null,senior,goals:goal?[goal]:(profile.goals||[]),created:profile.created||Date.now()};
    try{ if(photo&&photo.startsWith("data:")){ const r=await api("upload_photo",{image_base64:photo},60000); if(r.photo_url){ p.photoUrl=r.photo_url; } } }catch(e){}
    setBusyMsg("建立分身中…");
    const vv=VOICES.find(v=>v.k===voice)||VOICES[0];
    try{ await api("profile",{patch:{member_name:me||null,avatar_name:p.avatarName,age:p.age,senior:!!senior,voice:vv.k==="soft"?"zh-TW-HsiaoYuNeural":"zh-TW-HsiaoChenNeural",rate:(senior?"-15%":vv.k==="soft"?"-10%":"-5%"),variant,goals:p.goals,consent_version:"1.2",consented_at:new Date().toISOString()}},20000); }catch(e){}
    setProfile(p); await saveDoc("profile",p); await saveDoc("chat",{msgs:[]}); try{ localStorage.setItem("av","0"); }catch(e){}
    /* 入會驚豔片（OmniHuman）：背景生成，完成後首頁自動換成會開口的影片 */
    try{ const g=await api("render",{kind:"greeting",text:`${me?me+"，":""}我是${p.avatarName}，理想中的你。從今天開始，我每天陪你，一起慢慢變成她。`},30000); if(g.render_id){ p.greetRender=g.render_id; await saveDoc("profile",p); setProfile({...p}); } }catch(e){ p.greetErr=String(e.message||e).slice(0,80); p.greetTry=Date.now(); await saveDoc("profile",p); setProfile({...p}); }
    setBusy(false); SFX.open(); buzz([20,40,20]); go("home"); }
  const S=[
    h`<div class="wiz"><p class="big">先讓我唸一下同意書，聽完按「我同意」。</p><div class="consent">我同意己美 Self AI 使用我上傳的照片與錄音，製作只供我本人使用的數位分身與聲音。分身不會用於任何其他用途；我可以隨時在「我的」刪除分身與所有資料。分身提供的是陪伴與整理資訊，不是醫療建議；療程請與己美認證醫師面談。<br/><small style=${{color:"var(--muted)"}}>肖像與聲音同意書 v1.2・patient_consents: likeness_ai, voice_clone</small></div>
      <button class="btn" onClick=${()=>{SFX.send();setStep(1);}}>我同意</button><button class="btn ghost" onClick=${()=>go("home")}>先不要</button></div>`,
    h`<div class="wiz"><p class="big">把臉放進框裡，<br/>正面看鏡頭就好。</p>
      <div class="shot">${photo?h`<img src=${photo} alt=""/>`:h`<div class="note" style=${{textAlign:"center",padding:"0 24px"}}>光線亮一點・頭髮不要遮到臉・嘴唇自然閉合</div>`}<div class="frame"></div><label><input type="file" id="shot" accept="image/*" capture="user" onChange=${onFile}/></label></div>
      <button class="btn" onClick=${()=>{ if(photo){SFX.send();setStep(2);} else document.getElementById("shot").click(); }}>${photo?"就用這張 ✓":"📷 拍照或選照片"}</button>${photo?h`<button class="btn ghost" onClick=${()=>document.getElementById("shot").click()}>重拍</button>`:null}</div>`,
    h`<div class="wiz"><p class="big">選一個你最喜歡的樣子。</p><div class="variants">${VARS.map(([n,f])=>h`<button class=${variant===n?"on":""} onClick=${()=>{setVariant(n);SFX.tick();}}><img src=${photo} style=${{filter:f}} alt=""/><b>${n}</b></button>`)}</div>
      <p class="note">正式版由己美理想自我引擎生成三款高清版本（術後模擬進階版為增值服務）；此處為即時預覽。</p><button class="btn" onClick=${()=>{SFX.send();setStep(3);}}>就是她 ✓</button></div>`,
    h`<div class="wiz"><p class="big">她要用什麼聲音跟你說話？</p><div class="voices">${VOICES.map(v=>h`<button class=${voice===v.k?"on":""} onClick=${()=>{setVoice(v.k); voicePref={rate:v.rate*(senior?.9:1),pitch:v.pitch}; speak("你好，我會每天陪著你。"); SFX.tick();}}><span>${v.n}</span><small>試聽 ▶</small></button>`)}</div>
      <label class="toggle"><span>長輩模式<br/><small style=${{color:"var(--muted)"}}>語速放慢、句子更短、字更大</small></span><input type="checkbox" checked=${senior} onChange=${e=>setSenior(e.target.checked)}/></label>
      <p class="note">金卡會員可加購「聲音克隆」，用你自己的聲音。</p><button class="btn" onClick=${()=>{SFX.send();setStep(4);}}>下一步</button></div>`,
    h`<div class="wiz"><p class="big">幫她取個名字，<br/>也告訴我怎麼稱呼你。</p>
      <div class="field"><label>她的名字</label><input id="avname" value=${name} onInput=${e=>setName(e.target.value)} placeholder="例如：小美、Mia、理想的我"/></div>
      <div class="field"><label>你的稱呼</label><input id="myname" value=${me} onInput=${e=>setMe(e.target.value)} placeholder="例如：美玲"/></div>
      <div class="field"><label>年齡（選填，讓她說話更貼心）</label><input id="age" type="number" inputmode="numeric" value=${age} onInput=${e=>setAge(e.target.value)} placeholder="例如：58"/></div>
      <div class="field"><label>最想改善的一件事</label><input id="goal" value=${goal} onInput=${e=>setGoal(e.target.value)} placeholder="例如：眼周細紋"/></div>
      <button class="btn" onClick=${()=>{SFX.send();setStep(5);}}>完成</button></div>`,
    h`<div class="wiz center"><p class="big">完成了。<br/>${name||"她"}想跟你說第一句話。</p>${photo?h`<img src=${photo} style=${{width:160,height:213,objectFit:"cover",borderRadius:22,border:"2px solid var(--gold)",margin:"0 auto",display:"block",boxShadow:"var(--shadow)"}} alt=""/>`:null}
      <p class="note">完成後會在背景生成她的開口影片（約 5–10 分鐘），好了會自動出現在首頁。</p><button class="btn" disabled=${busy} onClick=${finish}>${busy?busyMsg||"儲存中…":"去見她 ✦"}</button></div>`];
  return h`<div class="page"><${Back} go=${go}/><div><span class="eyebrow">Create your twin</span><h2>建立我的分身</h2></div><div class="steps">${[0,1,2,3,4,5].map(i=>h`<i class=${i<=step?"on":""}></i>`)}</div>${S[step]}</div>`;
}

  <section class="glass">${MEMBER.goals.map(g=>h`<div style=${{padding:"10px 0"}}><div class="kv" style=${{border:0,padding:"0 0 6px"}}><span>${g.t}</span><span class="pill">${g.d} 前</span></div><div class="bar2"><i style=${{width:g.p+"%"}}></i></div></div>`)}<button class="btn ghost" style=${{marginTop:10}}>＋ 新增目標（用講的）</button></section>
  <section class="glass"><h3>30 天計劃</h3><div class="list"><div class="item"><div class="av">1</div><div class="t">第 1–7 天：建立保養節奏<small>早晚各一次，分身提醒</small></div><span class="pill ok">進行中</span></div><div class="item"><div class="av">2</div><div class="t">第 8–14 天：認證醫師諮詢<small>分身整理需求帶去</small></div><span class="pill">待安排</span></div></div></section>

  <section class="glass"><div class="list">${MEMBER.log.map(x=>h`<div class="item"><div class="av">${x.d.slice(0,2)}</div><div class="t">${x.m}<small>${x.n}</small></div></div>`)}</div><button class="btn" style=${{marginTop:12}}>🎤 跟她說今天的事</button></section>

function MemberCard({member,setMember}){ const [busy,setBusy]=useState(false);
  const login=async(c)=>{ if(busy) return; setBusy(true); SFX.send(); buzz(15); const ok=await memberLogin(c); if(!ok){ setBusy(false); alert("登入服務暫時無法連線，請稍後再試。"); } };
  if(!member) return h`<section class="glass"><b style=${{fontFamily:"var(--cjk)",fontSize:17}}>登入己美會員</b><div class="note" style=${{margin:"6px 0 12px"}}>登入後，分身和對話會跟著你的己美帳號走；換手機、重新安裝都不會不見。</div>
    <button class="btn line" disabled=${busy} onClick=${()=>login("line")}><i>L</i>用 LINE 登入</button>
    <button class="btn ghost" style=${{marginTop:8}} disabled=${busy} onClick=${()=>login()}>用 Email／手機登入</button>
    <p class="note" style=${{marginTop:10,fontSize:12}}>還沒有己美帳號？登入頁可以直接註冊，基礎銀卡會員免費。</p></section>`;
  const ini=(member.name||"己").slice(0,1);
  return h`<section class="glass"><div class="mcard"><div class="ini">${member.avatar_url?h`<img src=${member.avatar_url} alt=""/>`:ini}</div><div style=${{flex:1,minWidth:0}}><b style=${{fontFamily:"var(--cjk)",fontSize:17}}>${member.name||"己美會員"}</b><div class="note" style=${{overflow:"hidden",textOverflow:"ellipsis"}}>${member.email||""}${member.vip_end?`・VIP 至 ${String(member.vip_end).slice(0,10)}`:""}</div></div><span class=${"pill"+(member.paid?" ok":"")}>${member.tier_label||member.tier}</span></div>
    <div class="note" style=${{marginTop:10}}>分身與對話已跟著你的己美帳號，換手機登入就會回來。</div>
    ${Store.requirePaid&&!member.paid?h`<a class="btn" style=${{marginTop:10,display:"block",textAlign:"center",textDecoration:"none"}} href=${Store.upgradeUrl} target="_blank" rel="noopener">升級付費會員，開啟分身陪伴</a>`:null}
    <button class="btn ghost" style=${{marginTop:10,minHeight:40,fontSize:14}} onClick=${async()=>{ SFX.close(); buzz(10); await memberLogout(); setMember(null); }}>登出</button></section>`; }
function Me({go,profile,setProfile,member,setMember}){ return h`<div class="page"><${Back} go=${go}/><div><span class="eyebrow">Membership</span><h2>${member?(member.name||profile.name||"己美會員"):(profile.name||"你好")}・${member?(member.tier_label||member.tier):"尚未登入"}</h2></div>
  <${MemberCard} member=${member} setMember=${setMember}/>
  <section class="glass"><div class="avcard">${profile.photo?h`<img src=${profile.photo} alt=""/>`:h`<div class="sil">✦</div>`}<div style=${{flex:1}}><b style=${{fontFamily:"var(--cjk)",fontSize:18}}>${profile.avatarName||"尚未建立分身"}</b><div class="note">${profile.photo?`聲音：${(VOICES.find(v=>v.k===profile.voice)||VOICES[0]).n}・${profile.variant||"原圖"}${profile.senior?"・長輩模式":""}`:"拍一張照，就能擁有理想中的自己"}</div>
    <div class="row" style=${{marginTop:8}}><button class="btn" style=${{minHeight:40,fontSize:14}} onClick=${()=>go("create")}>${profile.photo?"重新建立":"建立分身"}</button>${profile.photo?h`<button class="btn ghost" style=${{minHeight:40,fontSize:14}} onClick=${async()=>{ const p={...profile,photo:null,avatarName:"",variant:"原圖"}; setProfile(p); await saveDoc("profile",p); SFX.close(); }}>刪除分身</button>`:null}</div></div></div></section>
  <section class="glass"><div class="kv"><span>本月即時對話</span><b>${MEMBER.liveMinutes.used}<small style=${{fontSize:14,color:"var(--muted)"}}> / ${MEMBER.liveMinutes.total} 分</small></b></div><div class="bar2"><i style=${{width:(MEMBER.liveMinutes.used/MEMBER.liveMinutes.total*100)+"%"}}></i></div></section>
  <section class="glass"><div class="pricing"><div class="plan hi"><small>銀卡</small><b>NT$ 990<small>/月</small></b><small>每日問候・30 分即時對話・生活記錄</small></div><div class="plan"><small>金卡</small><b>NT$ 2,490<small>/月</small></b><small>120 分・她本人的聲音・優先預約</small></div></div><button class="btn" style=${{marginTop:12}}>升級金卡</button><button class="btn ghost" style=${{marginTop:8}}>請家人幫我付</button></section>
  <section class="glass"><h3>增值服務</h3><div class="list"><div class="item"><div class="t">聲音克隆<small>用她自己的聲音說話</small></div><span class="pill rose">NT$ 490</span></div><div class="item"><div class="t">術後模擬進階版<small>3 款理想自我・高清</small></div><span class="pill rose">NT$ 690</span></div><div class="item"><div class="t">加購即時對話 60 分<small>當月有效</small></div><span class="pill rose">NT$ 390</span></div></div></section><p class="sample">示範價格，正式以綠界／Stripe／PayPal 結帳</p></div>`; }
function Settings({go,profile,setProfile}){ const upd=async(patch)=>{ const p={...profile,...patch}; setProfile(p); await saveDoc("profile",p); SFX.tick(); };
  return h`<div class="page"><${Back} go=${go}/><div><span class="eyebrow">Settings</span><h2>設定</h2></div>
  <section class="glass"><div class="list">
    <label class="toggle"><span>長輩模式<br/><small style=${{color:"var(--muted)"}}>語速放慢、字更大、句子更短</small></span><input type="checkbox" id="senior" checked=${!!profile.senior} onChange=${e=>upd({senior:e.target.checked})}/></label>
    <div class="voices">${VOICES.map(v=>h`<button class=${(profile.voice||"warm")===v.k?"on":""} onClick=${()=>{ upd({voice:v.k}); voicePref={rate:v.rate*(profile.senior?.9:1),pitch:v.pitch}; speak("你好，我會每天陪著你。"); }}><span>分身聲音・${v.n}</span><small>試聽 ▶</small></button>`)}</div><div class="item"><div class="t">LINE 提醒<small>忘了開 App 時由 LINE 提醒</small></div><span class="pill ok">開啟</span></div><div class="item"><div class="t">肖像與聲音同意書<small>v1.2${profile.consent?"・已同意":"・尚未同意"}</small></div><span class="pill">${profile.consent?"已同意":"未同意"}</span></div></div></section></div>`; }

function AdBar(){
  const [ads,setAds]=useState(ADS_DEFAULT);
  useEffect(()=>{ api("ads",{},8000).then(r=>{ if(r.ads&&r.ads.length) setAds(r.ads); }).catch(()=>{}); },[]);
  const img=ads.find(a=>a.img);
  return h`<div class="adbar">${img?h`<img src=${img.img} alt=""/>`:null}<div class="tk"><span>${ads.map((a,i)=>h`<i key=${i}>✦</i>${a.u?h`<a href=${a.u} target="_blank" rel="noopener">${a.t}</a>`:a.t}　　`)}</span></div></div>`;
}
function App(){
  const [p,setP]=useState("home");
  const [profile,setProfile]=useState(()=>{ try{ return JSON.parse(localStorage.getItem("doc:profile"))||{}; }catch(e){ return {}; } });
  const [ready,setReady]=useState(false);
  const [member,setMember]=useState(()=>Member.get());
  const [notice,setNotice]=useState(null);
  useEffect(()=>{ (async()=>{ await storeInit();
    /* 己美會員登入回跳（?code=&state=） */
    const cb=await handleCallback(); if(cb&&cb.reload) return;
    if(cb&&cb.member){ setMember(cb.member); setP("me"); setNotice({t:`歡迎回來，${cb.member.name||"己美會員"}。分身已經跟著你的帳號了。`}); }
    else if(cb&&cb.error){ setP("me"); setNotice({t:cb.error==="access_denied"?"你取消了登入，隨時可以再登入。":"登入沒有完成，請再試一次。",err:true}); }
    try{ if(sessionStorage.getItem("selfai_open")==="me"){ sessionStorage.removeItem("selfai_open"); setP("me"); setNotice({t:"歡迎回來。你在別台建立的分身已經回來了。"}); } }catch(e){}
    const pr=await loadDoc("profile",null); if(pr) setProfile(pr);
    try{ const me=await api("self_me",{},8000); Store.requirePaid=!!me.require_paid; if(me.upgrade_url) Store.upgradeUrl=me.upgrade_url; if(me.member){ Member.set(me.member); setMember(me.member); } else if(!(cb&&cb.member)){ Member.set(null); setMember(null); } }catch(e){}
    setReady(true); })(); },[]);
  useEffect(()=>{ if(!notice) return; const t=setTimeout(()=>setNotice(null),7000); return ()=>clearTimeout(t); },[notice]);
  /* 入會影片輪詢：好了就寫進 profile.greetVideo */
  useEffect(()=>{ if(!profile.greetRender||profile.greetVideo) return; let stop=false;
    const tick=async()=>{ if(stop) return; try{ const r=await api("render_status",{render_id:profile.greetRender},20000); if(r.status==="done"&&r.video_url){ const p={...profile,greetVideo:r.video_url}; setProfile(p); await saveDoc("profile",p); return; } if(r.status==="failed"){ const p={...profile,greetRender:null}; setProfile(p); await saveDoc("profile",p); return; } }catch(e){} setTimeout(tick,20000); };
    tick(); return ()=>{ stop=true; }; },[profile.greetRender,profile.greetVideo]);
  /* 開口影片若之前沒排進佇列（例如額度不足），每次開啟最多每 30 分鐘自動重試一次 */
  useEffect(()=>{ if(!profile.photo||!profile.photoUrl||profile.greetRender||profile.greetVideo) return; const last=+profile.greetTry||0; if(Date.now()-last<30*60*1000) return;
    (async()=>{ const p0={...profile,greetTry:Date.now()}; setProfile(p0); await saveDoc("profile",p0);
      try{ const g=await api("render",{kind:"greeting",text:`${profile.name?profile.name+"，":""}我是${profile.avatarName||"你的分身"}，理想中的你。從今天開始，我每天陪你，一起慢慢變成她。`},30000); if(g.render_id){ const p={...p0,greetRender:g.render_id,greetErr:null}; setProfile(p); await saveDoc("profile",p); } }
      catch(e){ const p={...p0,greetErr:String(e.message||e).slice(0,80)}; setProfile(p); await saveDoc("profile",p); } })(); },[profile.photoUrl,profile.greetRender,profile.greetVideo]);
  useEffect(()=>{ window.scrollTo(0,0); stopSpeak(); },[p]);
  const Page={home:Home,goals:Goals,log:Log,clinic:Clinic,photo:Photo,explore:Explore,me:Me,settings:Settings,create:Create}[p]||Home;
  /* 會員已登入但還沒在分身精靈填名字 → 先用己美帳號的稱呼 */
  const prof=(member&&member.name&&!profile.name)?{...profile,name:member.name}:profile;
  if(!ready) return h`<div class="hero" style=${{display:"grid",placeItems:"center",color:"var(--ink)"}}><div class="logo" style=${{textAlign:"center"}}><div class="mark">SELF<b>己美</b></div><small>BEAUTY, HEALTH, A BETTER YOU</small></div></div>`;
  return h`<div class=${p==="home"?"":"page-root"}>${notice?h`<div class=${"toast"+(notice.err?" err":"")} role="status" onClick=${()=>setNotice(null)}>${notice.t}</div>`:null}<${Page} go=${setP} profile=${prof} setProfile=${setProfile} member=${member} setMember=${setMember} key=${p==="home"?"home-"+(profile.photo?1:0):p}/>
    <nav class="bar"><div class="in"><${AdBar}/>
      <div class="qn">
        <button class=${"tab"+(p==="home"?" on":"")} onClick=${()=>setP("home")}><span class="i">✦</span>首頁</button>
        <a class="tab" href="https://beauti.self.com.tw/upload" target="_blank" rel="noopener"><span class="i">▣</span>拍照</a>
        <a class="tab" href="https://dr.self.com.tw" target="_blank" rel="noopener"><span class="i">♡</span>診所</a>
        <button class=${"tab"+(p==="me"?" on":"")} onClick=${()=>setP("me")}><span class="i">◯</span>我的</button>
        <button class=${"tab"+(p==="settings"?" on":"")} onClick=${()=>setP("settings")}><span class="i">⚙</span>設定</button>
      </div></div></nav></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script></body></html>
